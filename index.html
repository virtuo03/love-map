<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa dei Ricordi</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Internal CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/tabs.css">
    <link rel="stylesheet" href="css/components/map.css">
    <link rel="stylesheet" href="css/components/cards.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c2185b">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Scatola dei Ricordi">
</head>
<body>
    <header>
        <h1><i class="heart-icon fas fa-heart"></i> Mappa dei Ricordi <i class="heart-icon fas fa-heart"></i></h1>
        <p class="subtitle">Mappa dei nostri momenti speciali</p>
    </header>

    <div class="app-container">
        <!-- Main Map View -->
        <div id="map-section" class="tab-content active">
            <div id="map"></div>
            
            <!-- Sidebar for memory form -->
            <div class="sidebar" id="memory-form-sidebar">
                <button class="btn-close-sidebar" id="close-sidebar">
                    <i class="fas fa-times"></i>
                </button>
                <h2><i class="fas fa-plus-circle"></i> Aggiungi un Ricordo</h2>
                <form id="memory-form">
                    <div class="form-group">
                        <label for="memory-title"><i class="fas fa-heading"></i> Titolo</label>
                        <input type="text" id="memory-title" required placeholder="Es. Il nostro primo incontro">
                    </div>
                    <div class="form-group">
                        <label for="memory-desc"><i class="fas fa-comment"></i> Descrizione</label>
                        <textarea id="memory-desc" required
                            placeholder="Racconta questo momento speciale..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="memory-date"><i class="fas fa-calendar-day"></i> Data del ricordo</label>
                        <input type="date" id="memory-date" required>
                    </div>
                    <div class="form-group">
                        <label for="memory-location"><i class="fas fa-map-marker-alt"></i> Posizione (clicca sulla
                            mappa)</label>
                        <input type="text" id="memory-location" readonly
                            placeholder="Clicca sulla mappa per selezionare">
                    </div>
                    <div class="form-group">
                        <label for="memory-photo"><i class="fas fa-camera"></i> Aggiungi una foto</label>
                        <input type="file" id="memory-photo" accept="image/*">
                    </div>
                    <div class="button-group">
                        <button type="submit"><i class="fas fa-save"></i> Salva Ricordo</button>
                        <button type="button" id="cancel-edit" style="display: none;">
                            <i class="fas fa-times"></i> Annulla
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Overlay for memory list -->
            <div class="memory-list-overlay" id="memory-list-overlay">
                <button class="btn-close-sidebar" id="close-memory-list">
                    <i class="fas fa-times"></i>
                </button>
                <div class="section-header">
                    <div class="controls-container">
                        <div class="layout-toggle">
                            <button id="layout-vertical" class="layout-btn btn-small active" title="Layout Verticale">
                                <i class="fas fa-th-large"></i>
                            </button>
                            <button id="layout-horizontal" class="layout-btn btn-small" title="Layout Orizzontale">
                                <i class="fas fa-bars"></i>
                            </button>
                        </div>
                        <div class="import-export-buttons">
                            <button id="export-memories" class="btn-small btn-export">
                                <i class="fas fa-share-alt"></i> Esporta
                            </button>
                            <button id="import-memories" class="btn-small btn-import">
                                <i class="fas fa-download"></i> Importa
                            </button>
                        </div>
                    </div>
                </div>
                <div class="memories-grid vertical-layout" id="memories-container">
                    <!-- I ricordi verranno inseriti qui dinamicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" data-tab="map-section">
            <i class="fas fa-map-marked-alt"></i>
            <span>Mappa</span>
        </button>
        <button class="nav-btn" id="nav-memories">
            <i class="fas fa-list"></i>
            <span>Ricordi</span>
        </button>
        <button class="nav-btn" id="nav-add">
            <i class="fas fa-plus"></i>
            <span>Aggiungi</span>
        </button>
    </div>

    <!-- External JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Internal JS -->
    <script src="js/clustering.js"></script>
    <script src="js/map.js"></script>
    <script src="js/memory-manager.js"></script>
    <script src="js/ui-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
